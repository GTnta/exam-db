name: Build question images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF renderer
        run: python -m pip install pymupdf==2.0.0
      - name: Build images
        run: |
          python scripts/render-context-images.py
          python scripts/render-context-images.py --kind question
          node scripts/test-context-search.mjs
          node scripts/check-db.mjs
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images/context data/images/selected
          git diff --cached --quiet || git commit -m "Build question images"
          git push
